name: github pages

on:
  push:
    branches:
      - main
  pull_request:

# Actions are pinned to commit SHAs so a moved tag upstream cannot change
# what runs here. Comments record the human-readable version.
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for .GitInfo and .Lastmod

      # Same version and checksum the dev container uses, read from the same
      # file, so the binary here is byte-identical to the local one.
      - name: Install pinned Hugo
        run: |
          set -euo pipefail
          . .devcontainer/versions.env
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256_AMD64}  /tmp/hugo.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      # Processed images survive between runs, so only changed images are
      # re-encoded. Safe to miss: a cold cache just rebuilds them.
      - name: Cache processed images
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('content/**/*.png', 'content/**/*.jpg', 'assets/**') }}
          restore-keys: hugo-resources-

      # The Congo theme is committed under _vendor/, so nothing is downloaded.
      - name: Build
        run: hugo --gc --minify --baseURL "https://sina.page/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: sina.page
